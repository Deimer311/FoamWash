serenity.report.language = "es"
serenity.language = "es"

serenity {
  take.screenshots = FOR_EACH_ACTION
  report.show.step.details = true
  restart.browser.for.each = scenario
  report.accessibility = true
}

environments {
  default {
    webdriver.driver = chrome
    webdriver.autodownload = true
    webdriver.base.url = "http://localhost:3000"
    webdriver.capabilities {
      browserName = "chrome"
      acceptInsecureCerts = true
      "goog:chromeOptions" {
        args = ["remote-allow-origins=*", "test-type", "no-sandbox", "ignore-certificate-errors", "--start-maximized", "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking"]
      }
    }
  }
  web {
    webdriver.driver = chrome
    webdriver.autodownload = true
    webdriver.base.url = "http://localhost:3000"
    webdriver.capabilities {
      browserName = "chrome"
      acceptInsecureCerts = true
      "goog:chromeOptions" {
        args = ["remote-allow-origins=*", "test-type", "no-sandbox", "ignore-certificate-errors", "--start-maximized", "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking"]
      }
    }
  }
  mobile {
    webdriver.driver = appium
    appium {
      hub = "http://127.0.0.1:4723"
      platformName = "Android"
      automationName = "UIAutomator2"
      udid = "320615888739"
      appPackage = "com.example.foamwash"
      appActivity = ".MainActivity"
      noReset = true
      fullReset = false
      autoGrantPermissions = true
    }
  }
}

serenity.format = "single-page-html"
serenity.language = "es"
serenity.locale = "es"
