webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["remote-allow-origins=*", "test-type", "no-sandbox", "ignore-certificate-errors", "--start-maximized",
        "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking"]
    }
  }
}

serenity.report.language = "es"
serenity.language = "es"

serenity {
  take.screenshots = FOR_EACH_ACTION
  report.show.step.details = true
  restart.browser.for.each = scenario
}

environments {
  default {
    webdriver.base.url = "http://localhost:3000"
  }
}
