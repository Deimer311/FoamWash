  version: '3.8'

  services:

    # ── Base de datos MySQL ───────────────────────────
    mysql:
      image: mysql:8.0
      container_name: foamwash_mysql
      restart: unless-stopped
      environment:
        MYSQL_ROOT_PASSWORD: root1234
        MYSQL_DATABASE: foam_wash_db
      ports:
        - "3307:3306"  # Puerto 3307 para no chocar con XAMPP en 3306
      volumes:
        - mysql_data:/var/lib/mysql
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 10s
        timeout: 5s
        retries: 5

    # ── Backend NestJS ────────────────────────────────
    backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: foamwash_backend
      restart: unless-stopped
      ports:
        - "5000:5000"
      environment:
        DATABASE_URL: mysql://root:root1234@mysql:3306/foam_wash_db
        JWT_SECRET: cambia_esto_por_un_secreto_seguro_min32chars
        JWT_REFRESH_SECRET: otro_secreto_diferente_para_refresh_min32chars
        JWT_EXPIRES_IN: 7d
        NODE_ENV: production
        FRONTEND_URL: http://localhost:3000
        PORT: 5000
      depends_on:
        mysql:
          condition: service_healthy

    # ── Frontend React + Vite ─────────────────────────
    frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: foamwash_frontend
      restart: unless-stopped
      ports:
        - "3000:80"
      depends_on:
        - backend

  # ── Volúmenes ─────────────────────────────────────
  volumes:
    mysql_data: